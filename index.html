<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>电子签名板 · 手写 / 图片 / 文字 / PSD</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #0e1014;
      color: #e7eaf0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ---------- 顶栏 ---------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      background: #14171e;
      border-bottom: 1px solid #262b36;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
      color: #fff;
      white-space: nowrap;
    }

    .brand small {
      font-weight: 400;
      color: #8b93a7;
      margin-left: 6px;
      font-size: 12px;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      flex: 1;
      min-width: 0;
    }

    .tools::-webkit-scrollbar {
      display: none;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: #1b1f28;
      border: 1px solid #262b36;
      border-radius: 10px;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .group>label {
      font-size: 12px;
      color: #8b93a7;
    }

    button,
    .file-btn {
      appearance: none;
      border: 1px solid #2e3542;
      background: #232935;
      color: #dfe4ee;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: .15s;
      font-family: inherit;
      line-height: 1.2;
      white-space: nowrap;
    }

    button:hover,
    .file-btn:hover {
      background: #2c3442;
      border-color: #3c465a;
    }

    button:active,
    .file-btn:active {
      transform: scale(.97);
    }

    button.active {
      background: #4f8cff;
      border-color: #4f8cff;
      color: #fff;
    }

    button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    button.primary {
      background: #4f8cff;
      border-color: #4f8cff;
      color: #fff;
    }

    button.primary:hover {
      background: #3d7bf0;
    }

    button.danger:hover {
      background: #4a2126;
      border-color: #7a3038;
    }

    .swatch {
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      box-shadow: 0 0 0 1px #3c465a inset;
      flex: 0 0 auto;
    }

    .swatch.active {
      border-color: #4f8cff;
      box-shadow: 0 0 0 1px #4f8cff inset, 0 0 0 2px #0e1014;
    }

    input[type="color"] {
      width: 28px;
      height: 26px;
      padding: 0;
      border: 1px solid #3c465a;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      flex: 0 0 auto;
    }

    input[type="range"] {
      width: 90px;
      accent-color: #4f8cff;
      cursor: pointer;
    }

    #sizeVal,
    #fontSizeVal {
      font-size: 12px;
      color: #8b93a7;
      width: 26px;
      text-align: center;
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      color: #b8c0d0;
      cursor: pointer;
    }

    .chk input {
      accent-color: #4f8cff;
    }

    /* ---------- 画布区 ---------- */
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    .paper {
      position: relative;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06);
      overflow: hidden;
      background-image:
        linear-gradient(45deg, #f0f2f6 25%, transparent 25%),
        linear-gradient(-45deg, #f0f2f6 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f0f2f6 75%),
        linear-gradient(-45deg, transparent 75%, #f0f2f6 75%);
      background-size: 18px 18px;
      background-position: 0 0, 0 9px, 9px -9px, -9px 0;
      background-color: #fff;
      touch-action: none;
    }

    .paper .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
      pointer-events: none;
    }

    .paper canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b9c0cf;
      font-size: 15px;
      letter-spacing: 2px;
      pointer-events: none;
      transition: opacity .35s;
    }

    .hint.hidden {
      opacity: 0;
    }

    /* ---------- 对象层 ---------- */
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .obj {
      position: absolute;
      transform-origin: center center;
      pointer-events: auto;
      cursor: move;
      touch-action: none;
      --inv: 1;
    }

    .obj.selected {
      outline: 2px solid #4f8cff;
      outline-offset: 6px;
    }

    .obj img {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .obj span {
      display: block;
      line-height: 1;
      white-space: pre;
      pointer-events: none;
    }

    .obj .handle {
      position: absolute;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      border-radius: 50%;
      background: #4f8cff;
      border: 2px solid #fff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .45);
      display: none;
      transform: scale(var(--inv, 1));
      transform-origin: center center;
      pointer-events: auto;
      touch-action: none;
      font-size: 11px;
      line-height: 14px;
      text-align: center;
      color: #fff;
      font-weight: 700;
      font-family: sans-serif;
    }

    .obj.selected .handle {
      display: block;
    }

    .handle.del {
      left: 100%;
      top: 0;
      background: #e05252;
    }

    .handle.rotate {
      left: 50%;
      top: 0;
      background: #2fb07a;
      cursor: grab;
    }

    .handle.scale {
      left: 100%;
      top: 100%;
      cursor: nwse-resize;
    }

    /* ---------- 底栏 ---------- */
    .bottombar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      background: #14171e;
      border-top: 1px solid #262b36;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }

    .spacer {
      flex: 1;
    }

    /* ---------- 文字签名面板 ---------- */
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 100;
      display: none;
    }

    .mask.show {
      display: block;
    }

    .text-panel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(440px, calc(100vw - 32px));
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      background: #171b23;
      border: 1px solid #2c3342;
      border-radius: 14px;
      padding: 18px;
      z-index: 101;
      display: none;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .7);
    }

    .text-panel.show {
      display: block;
    }

    .text-panel h3 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .tp-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .tp-row>label {
      font-size: 13px;
      color: #8b93a7;
      width: 38px;
      flex: 0 0 auto;
    }

    .tp-row input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #0f1218;
      border: 1px solid #2e3542;
      color: #e7eaf0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .tp-row input[type="text"]:focus {
      border-color: #4f8cff;
    }

    .tp-row select {
      flex: 1;
      min-width: 0;
      background: #0f1218;
      border: 1px solid #2e3542;
      color: #e7eaf0;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      cursor: pointer;
    }

    .tp-colors {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .tp-colors .swatch {
      width: 22px;
      height: 22px;
    }

    .tp-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .tp-actions button {
      flex: 1;
      padding: 11px;
      font-size: 14px;
    }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 36, 48, .96);
      border: 1px solid #3c465a;
      color: #e7eaf0;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 999;
      max-width: 80vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 8px 10px;
        gap: 8px;
      }

      .brand small {
        display: none;
      }

      .stage {
        padding: 8px;
      }

      .bottombar {
        padding: 8px 10px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
      }

      button,
      .file-btn {
        padding: 8px 11px;
        font-size: 12.5px;
      }

      input[type="range"] {
        width: 70px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">✍️ 电子签名板<small>手写 / 图片 / 文字</small></div>
      <div class="tools">
        <div class="group" id="colorGroup">
          <button class="swatch active" data-color="#111111" style="background:#111111"></button>
          <button class="swatch" data-color="#1a3fa0" style="background:#1a3fa0"></button>
          <button class="swatch" data-color="#c0272d" style="background:#c0272d"></button>
          <button class="swatch" data-color="#0b7a3b" style="background:#0b7a3b"></button>
          <button class="swatch" data-color="#6b3fa0" style="background:#6b3fa0"></button>
          <button class="swatch" data-color="#b07d00" style="background:#b07d00"></button>
          <input type="color" id="colorPick" value="#111111" title="自定义颜色">
        </div>
        <div class="group">
          <label>笔粗</label>
          <input type="range" id="sizeRange" min="1" max="16" step="0.5" value="3">
          <span id="sizeVal">3</span>
        </div>
        <div class="group">
          <button id="btnPen" class="active">✏️ 笔</button>
          <button id="btnEraser">🧽 橡皮</button>
        </div>
        <div class="group">
          <button id="btnUndo">↶ 撤销</button>
          <button id="btnRedo">↷ 重做</button>
          <button id="btnClear" class="danger">🗑 清空</button>
        </div>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="paper" id="paper">
        <img id="bgImg" class="bg" alt="">
        <canvas id="pad"></canvas>
        <div class="overlay" id="overlay"></div>
        <div class="hint" id="hint">在此区域签名</div>
      </div>
    </main>

    <footer class="bottombar">
      <button id="btnTextPanel">🔤 文字签名</button>
      <label class="file-btn">🖼 插入签名图片<input type="file" id="fileSign" accept="image/*" hidden></label>
      <label class="file-btn">🏞 设置底图<input type="file" id="fileBg" accept="image/*" hidden></label>
      <button id="btnRemoveBg">移除底图</button>
      <label class="chk"><input type="checkbox" id="autoCrop" checked> 自动裁剪</label>
      <div class="spacer"></div>
      <button id="btnPng" class="primary">导出透明 PNG</button>
      <button id="btnPngComposite">导出合成 PNG</button>
      <button id="btnPsd">导出 PSD</button>
    </footer>

  </div>

  <!-- 文字签名面板 -->
  <div class="mask" id="mask"></div>
  <div class="text-panel" id="textPanel">
    <h3>文字签名</h3>
    <div class="tp-row">
      <input type="text" id="textInput" placeholder="输入签名文字…" maxlength="24" value="张三">
    </div>
    <div class="tp-row">
      <label>字体</label>
      <select id="fontSelect"></select>
    </div>
    <div class="tp-row">
      <label>字号</label>
      <input type="range" id="fontSizeRange" min="24" max="180" step="1" value="72" style="flex:1">
      <span id="fontSizeVal">72</span>
    </div>
    <div class="tp-row">
      <label>颜色</label>
      <div class="tp-colors" id="textColors"></div>
      <input type="color" id="textColorPick" value="#111111">
    </div>
    <div class="tp-actions">
      <button id="btnAddText" class="primary">添加到画布</button>
      <button id="btnCloseText">取消</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      'use strict';

      /* =========================================================
       *  0. 基础工具
       * ========================================================= */
      const $ = (id) => document.getElementById(id);

      const stage = $('stage');
      const paper = $('paper');
      const pad = $('pad');
      const overlay = $('overlay');
      const bgImg = $('bgImg');
      const hint = $('hint');
      const toastEl = $('toast');

      const ctx = pad.getContext('2d', {willReadFrequently: true});
      const DPR = Math.min(window.devicePixelRatio || 1, 2);

      function toast(msg, ms) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => toastEl.classList.remove('show'), ms || 1800);
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = src;
        });
      }

      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

      /* =========================================================
       *  1. 状态
       * ========================================================= */
      const state = {
        color: '#111111',
        size: 3,
        eraser: false,
        bgImage: null,
      };

      const objects = [];
      let selectedId = null;
      let idCounter = 0;

      /* =========================================================
       *  2. 画布布局与尺寸
       * ========================================================= */
      let lastW = 0, lastH = 0;

      function layout() {
        const rect = stage.getBoundingClientRect();
        const availW = Math.max(200, rect.width - 32);
        const availH = Math.max(150, rect.height - 32);
        const ratio = 0.52;
        let w = availW;
        let h = w * ratio;
        if (h > availH) {h = availH; w = h / ratio;}
        w = Math.floor(w); h = Math.floor(h);
        if (w === lastW && h === lastH) return;

        const oldW = lastW, oldH = lastH;
        lastW = w; lastH = h;

        paper.style.width = w + 'px';
        paper.style.height = h + 'px';
        resizePad();

        if (oldW > 0 && oldH > 0) scaleObjects(oldW, oldH, w, h);
      }

      function resizePad() {
        const cw = paper.clientWidth;
        const ch = paper.clientHeight;
        const nw = Math.round(cw * DPR);
        const nh = Math.round(ch * DPR);
        if (pad.width === nw && pad.height === nh) return;

        let old = null;
        if (pad.width > 0 && pad.height > 0) {
          old = document.createElement('canvas');
          old.width = pad.width;
          old.height = pad.height;
          old.getContext('2d').drawImage(pad, 0, 0);
        }

        pad.width = nw;
        pad.height = nh;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, cw, ch);
        if (old) ctx.drawImage(old, 0, 0, cw, ch);

        history.undo.length = 0;
        history.redo.length = 0;
        updateUI();
      }

      function scaleObjects(oldW, oldH, newW, newH) {
        const sx = newW / oldW;
        const sy = newH / oldH;
        const s = Math.min(sx, sy);
        for (const obj of objects) {
          obj.x *= sx;
          obj.y *= sy;
          if (obj.type === 'image') {
            obj.baseW *= s;
            obj.baseH *= s;
          } else {
            obj.fontSize *= s;
            obj.baseW *= s;
            obj.baseH *= s;
          }
          updateObjectEl(obj);
        }
      }

      if (window.ResizeObserver) {
        new ResizeObserver(() => layout()).observe(stage);
      } else {
        window.addEventListener('resize', layout);
      }
      window.addEventListener('orientationchange', () => setTimeout(layout, 200));

      /* =========================================================
       *  3. 手写绘制
       * ========================================================= */
      let drawing = false;
      let activePointerId = null;
      let lastPoint = null;
      let cachedRect = null;
      let lastMoveTime = 0, lastMoveX = 0, lastMoveY = 0;
      let velFactor = 1;

      function applyStrokeStyle(width) {
        if (state.eraser) {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.strokeStyle = 'rgba(0,0,0,1)';
          ctx.fillStyle = 'rgba(0,0,0,1)';
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = state.color;
          ctx.fillStyle = state.color;
        }
        ctx.lineWidth = Math.max(0.4, width);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }

      function computeWidth(e) {
        const base = state.size;
        if (e.pointerType === 'pen' && e.pressure > 0 && e.pressure !== 0.5) {
          return base * (0.35 + e.pressure * 1.35);
        }
        if (e.pointerType !== 'pen') {
          const now = e.timeStamp || performance.now();
          if (lastMoveTime) {
            const dt = Math.max(8, now - lastMoveTime);
            const dist = Math.hypot(e.clientX - lastMoveX, e.clientY - lastMoveY);
            const speed = dist / dt;
            const target = Math.max(0.55, 1.15 - speed * 0.4);
            velFactor = velFactor * 0.75 + target * 0.25;
          }
          lastMoveTime = now;
          lastMoveX = e.clientX;
          lastMoveY = e.clientY;
          return base * velFactor;
        }
        return base;
      }

      function pointFromEvent(e) {
        const r = cachedRect || pad.getBoundingClientRect();
        return {
          x: e.clientX - r.left,
          y: e.clientY - r.top,
          w: computeWidth(e),
        };
      }

      function drawSegment(a, b) {
        applyStrokeStyle((a.w + b.w) / 2);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function hideHint() {hint.classList.add('hidden');}
      function showHint() {hint.classList.remove('hidden');}

      function onPointerDown(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        // 修复：有选中对象时，点击空白处取消选中并继续绘制
        if (selectedId !== null) {
          selectObject(null);
        }
        if (drawing) return;
        e.preventDefault();

        cachedRect = pad.getBoundingClientRect();
        activePointerId = e.pointerId;
        drawing = true;

        try {pad.setPointerCapture(e.pointerId);} catch (err) { /* ignore */}

        pushHistory();
        hideHint();

        lastMoveTime = 0;
        velFactor = 1;

        const p = pointFromEvent(e);
        lastPoint = p;

        applyStrokeStyle(p.w);
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(p.w / 2, 0.6), 0, Math.PI * 2);
        ctx.fill();
      }

      function onPointerMove(e) {
        if (!drawing || e.pointerId !== activePointerId) return;
        e.preventDefault();

        let events = [e];
        if (typeof e.getCoalescedEvents === 'function') {
          const list = e.getCoalescedEvents();
          if (list && list.length) events = list;
        }

        for (let i = 0; i < events.length; i++) {
          const p = pointFromEvent(events[i]);
          if (!lastPoint) {lastPoint = p; continue;}
          const dx = p.x - lastPoint.x;
          const dy = p.y - lastPoint.y;
          if (dx * dx + dy * dy < 0.04) continue;
          drawSegment(lastPoint, p);
          lastPoint = p;
        }
      }

      function onPointerUp(e) {
        if (e.pointerId !== activePointerId) return;
        drawing = false;
        activePointerId = null;
        lastPoint = null;
        cachedRect = null;
        try {pad.releasePointerCapture(e.pointerId);} catch (err) { /* ignore */}
        updateUI();
      }

      pad.addEventListener('pointerdown', onPointerDown, {passive: false});
      pad.addEventListener('pointermove', onPointerMove, {passive: false});
      pad.addEventListener('pointerup', onPointerUp);
      pad.addEventListener('pointercancel', onPointerUp);
      pad.addEventListener('contextmenu', (e) => e.preventDefault());

      /* =========================================================
       *  4. 历史记录
       * ========================================================= */
      const MAX_HISTORY = 20;
      const history = {undo: [], redo: []};

      function pushHistory() {
        try {
          history.undo.push(ctx.getImageData(0, 0, pad.width, pad.height));
          if (history.undo.length > MAX_HISTORY) history.undo.shift();
          history.redo.length = 0;
        } catch (err) {console.warn(err);}
      }

      function undo() {
        if (!history.undo.length) return;
        history.redo.push(ctx.getImageData(0, 0, pad.width, pad.height));
        ctx.putImageData(history.undo.pop(), 0, 0);
        updateUI();
      }

      function redo() {
        if (!history.redo.length) return;
        history.undo.push(ctx.getImageData(0, 0, pad.width, pad.height));
        ctx.putImageData(history.redo.pop(), 0, 0);
        updateUI();
      }

      function clearPad() {
        pushHistory();
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, pad.width, pad.height);
        ctx.restore();
        showHint();
        updateUI();
      }

      function handwritingIsEmpty() {
        try {
          if (pad.width === 0 || pad.height === 0) return true;
          const d = ctx.getImageData(0, 0, pad.width, pad.height).data;
          for (let i = 3; i < d.length; i += 4) if (d[i] > 0) return false;
        } catch (err) {return false;}
        return true;
      }

      function hasContent() {
        return objects.length > 0 || !handwritingIsEmpty();
      }

      function updateUI() {
        $('btnUndo').disabled = history.undo.length === 0;
        $('btnRedo').disabled = history.redo.length === 0;
      }

      /* =========================================================
       *  5. 可编辑对象
       * ========================================================= */
      function selectObject(id) {
        if (selectedId === id) return;
        selectedId = id;
        objects.forEach((o) => o.el.classList.toggle('selected', o.id === id));
      }

      function updateObjectEl(obj) {
        const el = obj.el;
        el.style.left = obj.x + 'px';
        el.style.top = obj.y + 'px';
        el.style.transform =
          'translate(-50%, -50%) scale(' + obj.scale + ') rotate(' + obj.rotation + 'deg)';
        el.style.setProperty('--inv', clamp(1 / obj.scale, 0.4, 3));
      }

      function buildObjectEl(obj) {
        const el = document.createElement('div');
        el.className = 'obj';
        el.dataset.id = obj.id;

        if (obj.type === 'image') {
          el.style.width = obj.baseW + 'px';
          el.style.height = obj.baseH + 'px';
          const img = document.createElement('img');
          img.src = obj.src;
          img.alt = '';
          img.draggable = false;
          el.appendChild(img);
        } else {
          const span = document.createElement('span');
          span.textContent = obj.text;
          span.style.fontFamily = obj.fontFamily;
          span.style.fontSize = obj.fontSize + 'px';
          span.style.color = obj.color;
          span.style.lineHeight = '1';
          el.appendChild(span);
        }

        el.insertAdjacentHTML('beforeend',
          '<div class="handle del" data-handle="del">×</div>' +
          '<div class="handle rotate" data-handle="rotate">↻</div>' +
          '<div class="handle scale" data-handle="scale"></div>'
        );

        el.addEventListener('pointerdown', (e) => startObjectDrag(e, obj));
        return el;
      }

      function addObject(obj) {
        obj.el = buildObjectEl(obj);
        objects.push(obj);
        overlay.appendChild(obj.el);
        updateObjectEl(obj);
        selectObject(obj.id);
        hideHint();
        toast('已添加，可拖动 / 缩放 / 旋转');
      }

      function deleteObject(id) {
        const idx = objects.findIndex((o) => o.id === id);
        if (idx < 0) return;
        objects[idx].el.remove();
        objects.splice(idx, 1);
        if (selectedId === id) selectedId = null;
        if (objects.length === 0 && handwritingIsEmpty()) showHint();
      }

      /* ---------- 拖拽 / 缩放 / 旋转 ---------- */
      let drag = null;

      function startObjectDrag(e, obj) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();

        selectObject(obj.id);

        const handleEl = e.target.closest('[data-handle]');
        const handle = handleEl ? handleEl.dataset.handle : null;

        if (handle === 'del') {
          deleteObject(obj.id);
          return;
        }

        const rect = paper.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;

        if (handle === 'scale') {
          drag = {
            mode: 'scale',
            obj,
            startDist: Math.max(1, Math.hypot(px - obj.x, py - obj.y)),
            startScale: obj.scale,
          };
        } else if (handle === 'rotate') {
          drag = {
            mode: 'rotate',
            obj,
            lastAngle: Math.atan2(py - obj.y, px - obj.x),
            accum: 0,
            startRot: obj.rotation,
          };
        } else {
          drag = {
            mode: 'move',
            obj,
            startX: px,
            startY: py,
            objX: obj.x,
            objY: obj.y,
          };
        }

        try {obj.el.setPointerCapture(e.pointerId);} catch (err) { /* ignore */}

        const onMove = (ev) => {
          if (!drag || drag.obj !== obj) return;
          ev.preventDefault();

          const r = paper.getBoundingClientRect();
          const x = ev.clientX - r.left;
          const y = ev.clientY - r.top;

          if (drag.mode === 'move') {
            obj.x = drag.objX + (x - drag.startX);
            obj.y = drag.objY + (y - drag.startY);
          } else if (drag.mode === 'scale') {
            const d = Math.hypot(x - obj.x, y - obj.y);
            obj.scale = clamp(drag.startScale * (d / drag.startDist), 0.08, 12);
          } else if (drag.mode === 'rotate') {
            const a = Math.atan2(y - obj.y, x - obj.x);
            let da = a - drag.lastAngle;
            if (da > Math.PI) da -= Math.PI * 2;
            if (da < -Math.PI) da += Math.PI * 2;
            drag.lastAngle = a;
            drag.accum += da;
            let deg = drag.startRot + (drag.accum * 180) / Math.PI;
            if (ev.shiftKey) deg = Math.round(deg / 15) * 15;
            obj.rotation = deg;
          }
          updateObjectEl(obj);
        };

        const onUp = (ev) => {
          drag = null;
          try {obj.el.releasePointerCapture(ev.pointerId);} catch (err) { /* ignore */}
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
        };

        window.addEventListener('pointermove', onMove, {passive: false});
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      }

      window.addEventListener('keydown', (e) => {
        if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId !== null) {
          const target = e.target;
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT')) return;
          e.preventDefault();
          deleteObject(selectedId);
        }
      });

      /* =========================================================
       *  6. 图片处理
       * ========================================================= */
      function hasAlphaChannel(imgData) {
        const d = imgData.data;
        for (let i = 3; i < d.length; i += 4) {
          if (d[i] < 250) return true;
        }
        return false;
      }

      function removeWhite(imgData, threshold) {
        const d = imgData.data;
        const low = threshold - 65;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          if (lum >= threshold) {
            d[i + 3] = 0;
          } else if (lum > low) {
            const t = (threshold - lum) / (threshold - low);
            d[i + 3] = Math.round(d[i + 3] * t);
          }
        }
      }

      function processSignatureImage(img) {
        const MAX_SIDE = 2200;
        let src = img;
        if (img.width > MAX_SIDE || img.height > MAX_SIDE) {
          const s = MAX_SIDE / Math.max(img.width, img.height);
          const tmp = document.createElement('canvas');
          tmp.width = Math.round(img.width * s);
          tmp.height = Math.round(img.height * s);
          tmp.getContext('2d').drawImage(img, 0, 0, tmp.width, tmp.height);
          src = tmp;
        }

        const c = document.createElement('canvas');
        c.width = src.width;
        c.height = src.height;
        const cx = c.getContext('2d', {willReadFrequently: true});
        cx.drawImage(src, 0, 0);

        try {
          const id = cx.getImageData(0, 0, c.width, c.height);
          if (!hasAlphaChannel(id)) {
            removeWhite(id, 205);
            cx.putImageData(id, 0, 0);
          }
        } catch (err) {console.warn('去白底失败', err);}

        return c;
      }

      function addImageObject(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = reader.result;
            loadImage(dataUrl).then((img) => {
              const processed = processSignatureImage(img);

              const cw = paper.clientWidth || 400;
              const ch = paper.clientHeight || 220;
              const fit = Math.min((cw * 0.6) / processed.width, (ch * 0.5) / processed.height, 1);
              const baseW = Math.max(40, processed.width * fit);
              const baseH = Math.max(20, processed.height * fit);

              let srcUrl;
              try {
                srcUrl = processed.toDataURL('image/png');
              } catch (e) {
                srcUrl = dataUrl;
              }

              addObject({
                id: ++idCounter,
                type: 'image',
                src: srcUrl,
                img: processed,
                baseW,
                baseH,
                x: cw / 2,
                y: ch / 2,
                scale: 1,
                rotation: 0,
              });
              resolve();
            }).catch((err) => reject(err));
          };
          reader.onerror = () => reject(new Error('文件读取失败'));
          reader.readAsDataURL(file);
        });
      }

      /* =========================================================
       *  7. 文字对象
       * ========================================================= */
      const FONTS = [
        {name: '系统默认', value: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'},
        {name: '黑体', value: 'SimHei, "Heiti SC", "Microsoft YaHei", sans-serif'},
        {name: '宋体', value: 'SimSun, "Songti SC", STSong, serif'},
        {name: '楷体', value: 'KaiTi, "Kaiti SC", STKaiti, "楷体", serif'},
        {name: '仿宋', value: 'FangSong, STFangsong, "仿宋", serif'},
        {name: '隶书', value: 'LiSu, STLiti, "隶书", serif'},
        {name: '行楷', value: 'STXingkai, "Xingkai SC", "行楷", cursive'},
        {name: '魏碑', value: 'STWeibei, "Weibei SC", serif'},
        {name: '手写英文', value: '"Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive'},
      ];

      function measureTextWidth(text, fontSize, fontFamily) {
        const mc = document.createElement('canvas').getContext('2d');
        mc.font = fontSize + 'px ' + fontFamily;
        return mc.measureText(text).width;
      }

      function addTextObject(text, fontFamily, color, fontSize) {
        const cw = paper.clientWidth || 400;
        const ch = paper.clientHeight || 220;
        const baseW = measureTextWidth(text, fontSize, fontFamily);
        const baseH = fontSize * 1.3;
        const offset = (objects.length % 6) * 14 - 35;

        addObject({
          id: ++idCounter,
          type: 'text',
          text,
          fontFamily,
          color,
          fontSize,
          baseW,
          baseH,
          x: cw / 2 + offset,
          y: ch / 2 + offset,
          scale: 1,
          rotation: 0,
        });
      }

      /* =========================================================
       *  8. 绘制对象到 canvas（导出用）
       * ========================================================= */
      function drawObjectToCtx(c, obj, scaleFactor) {
        c.save();
        c.translate(obj.x * scaleFactor, obj.y * scaleFactor);
        c.rotate((obj.rotation * Math.PI) / 180);
        c.scale(obj.scale * scaleFactor, obj.scale * scaleFactor);

        if (obj.type === 'image') {
          try {
            c.drawImage(obj.img, -obj.baseW / 2, -obj.baseH / 2, obj.baseW, obj.baseH);
          } catch (err) {console.warn('绘制图片对象失败', err);}
        } else {
          c.font = obj.fontSize + 'px ' + obj.fontFamily;
          c.fillStyle = obj.color;
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillText(obj.text, 0, 0);
        }
        c.restore();
      }

      /* =========================================================
       *  9. 导出：合成 / 裁剪
       * ========================================================= */
      function drawImageContain(c, img, w, h) {
        if (!img || !img.complete || !img.naturalWidth) return;
        const s = Math.min(w / img.width, h / img.height);
        const dw = img.width * s;
        const dh = img.height * s;
        c.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      }

      /**
       * 构建导出画布
       * 修复要点：
       * 1. 明确使用 paper 的 CSS 尺寸 × DPR 作为输出尺寸
       * 2. pad 通过 9 参数 drawImage 绘制，避免尺寸不一致
       * 3. 加安全判断，pad 尺寸为 0 时不绘制
       */
      function buildExportCanvas(includeBg) {
        const cssW = paper.clientWidth || lastW || 400;
        const cssH = paper.clientHeight || lastH || 220;
        const outW = Math.max(1, Math.round(cssW * DPR));
        const outH = Math.max(1, Math.round(cssH * DPR));

        const out = document.createElement('canvas');
        out.width = outW;
        out.height = outH;
        const c = out.getContext('2d');

        // 1. 底图
        if (includeBg && state.bgImage) {
          drawImageContain(c, state.bgImage, outW, outH);
        }

        // 2. 手写层（安全绘制）
        if (pad.width > 0 && pad.height > 0) {
          c.drawImage(pad, 0, 0, pad.width, pad.height, 0, 0, outW, outH);
        }

        // 3. 对象层
        const objScale = outW / cssW;
        for (const obj of objects) {
          drawObjectToCtx(c, obj, objScale);
        }

        return out;
      }

      function cropCanvas(src) {
        const w = src.width, h = src.height;
        if (!w || !h) return null;
        const d = src.getContext('2d').getImageData(0, 0, w, h).data;

        let minX = w, minY = h, maxX = -1, maxY = -1;
        for (let y = 0; y < h; y++) {
          const rowOff = y * w * 4;
          for (let x = 0; x < w; x++) {
            if (d[rowOff + x * 4 + 3] > 0) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < 0) return null;

        const pd = Math.round(10 * DPR);
        minX = Math.max(0, minX - pd);
        minY = Math.max(0, minY - pd);
        maxX = Math.min(w - 1, maxX + pd);
        maxY = Math.min(h - 1, maxY + pd);

        const cw = maxX - minX + 1;
        const ch = maxY - minY + 1;

        const out = document.createElement('canvas');
        out.width = cw;
        out.height = ch;
        out.getContext('2d').drawImage(src, minX, minY, cw, ch, 0, 0, cw, ch);
        return out;
      }

      function toBlobAsync(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('导出失败'))), 'image/png');
        });
      }

      /* =========================================================
       *  10. PSD 编码器
       * ========================================================= */
      class ByteWriter {
        constructor(size) {
          this.buf = new Uint8Array(size || 1 << 16);
          this.pos = 0;
        }
        _ensure(n) {
          if (this.pos + n <= this.buf.length) return;
          let s = this.buf.length * 2;
          while (s < this.pos + n) s *= 2;
          const nb = new Uint8Array(s);
          nb.set(this.buf.subarray(0, this.pos));
          this.buf = nb;
        }
        u8(v) {this._ensure(1); this.buf[this.pos++] = v & 0xff;}
        i16(v) {this.u16(v & 0xffff);}
        u16(v) {
          this._ensure(2);
          this.buf[this.pos++] = (v >>> 8) & 0xff;
          this.buf[this.pos++] = v & 0xff;
        }
        u32(v) {
          this._ensure(4);
          this.buf[this.pos++] = (v >>> 24) & 0xff;
          this.buf[this.pos++] = (v >>> 16) & 0xff;
          this.buf[this.pos++] = (v >>> 8) & 0xff;
          this.buf[this.pos++] = v & 0xff;
        }
        bytes(arr) {
          this._ensure(arr.length);
          this.buf.set(arr, this.pos);
          this.pos += arr.length;
        }
        ascii(s) {
          this._ensure(s.length);
          for (let i = 0; i < s.length; i++) this.buf[this.pos++] = s.charCodeAt(i) & 0xff;
        }
        patchU32(pos, v) {
          this.buf[pos] = (v >>> 24) & 0xff;
          this.buf[pos + 1] = (v >>> 16) & 0xff;
          this.buf[pos + 2] = (v >>> 8) & 0xff;
          this.buf[pos + 3] = v & 0xff;
        }
        result() {return this.buf.subarray(0, this.pos);}
      }

      function packBits(src) {
        const n = src.length;
        const out = new Uint8Array(n + Math.ceil(n / 128) + 4);
        let o = 0, i = 0;

        while (i < n) {
          let j = i;
          while (j + 1 < n && src[j + 1] === src[i] && j - i < 127) j++;
          const runLen = j - i + 1;

          if (runLen >= 2) {
            out[o++] = 257 - runLen;
            out[o++] = src[i];
            i = j + 1;
          } else {
            const start = i;
            let k = i;
            while (k < n) {
              if (k + 1 < n && src[k] === src[k + 1]) break;
              k++;
              if (k - start >= 128) break;
            }
            if (k === start) k = start + 1;
            out[o++] = k - start - 1;
            for (let m = start; m < k; m++) out[o++] = src[m];
            i = k;
          }
        }
        return out.subarray(0, o);
      }

      function encodeChannelRLE(rgba, ci, width, height) {
        const counts = new Uint16Array(height);
        const parts = [];
        let total = 0;
        const row = new Uint8Array(width);

        for (let y = 0; y < height; y++) {
          let o = y * width * 4 + ci;
          for (let x = 0; x < width; x++) {
            row[x] = rgba[o];
            o += 4;
          }
          const enc = packBits(row);
          counts[y] = enc.length;
          parts.push(enc);
          total += enc.length;
        }

        const data = new Uint8Array(total);
        let p = 0;
        for (let i = 0; i < parts.length; i++) {
          data.set(parts[i], p);
          p += parts[i].length;
        }
        return {counts, data};
      }

      function mergeLayers(layers, width, height) {
        const n = width * height * 4;
        const dst = new Uint8ClampedArray(n);

        for (let li = 0; li < layers.length; li++) {
          const src = layers[li].rgba;
          for (let i = 0; i < n; i += 4) {
            const sa = src[i + 3];
            if (sa === 0) continue;
            const da = dst[i + 3];
            if (sa === 255 || da === 0) {
              dst[i] = src[i];
              dst[i + 1] = src[i + 1];
              dst[i + 2] = src[i + 2];
              dst[i + 3] = sa;
              continue;
            }
            const saF = sa / 255;
            const daF = da / 255;
            const oaF = saF + daF * (1 - saF);
            if (oaF === 0) {dst[i + 3] = 0; continue;}
            const inv = 1 / oaF;
            dst[i] = (src[i] * saF + dst[i] * daF * (1 - saF)) * inv;
            dst[i + 1] = (src[i + 1] * saF + dst[i + 1] * daF * (1 - saF)) * inv;
            dst[i + 2] = (src[i + 2] * saF + dst[i + 2] * daF * (1 - saF)) * inv;
            dst[i + 3] = oaF * 255;
          }
        }
        return dst;
      }

      function encodePsd(width, height, layers, mergedRgba) {
        const w = new ByteWriter(1 << 18);

        w.ascii('8BPS');
        w.u16(1);
        for (let i = 0; i < 6; i++) w.u8(0);
        w.u16(4);
        w.u32(height);
        w.u32(width);
        w.u16(8);
        w.u16(3);

        w.u32(0);
        w.u32(0);

        const lmLenPos = w.pos;
        w.u32(0);
        const lmStart = w.pos;

        const liLenPos = w.pos;
        w.u32(0);
        const liStart = w.pos;

        const nLayers = layers.length;
        w.i16(nLayers);

        const chansPerLayer = layers.map((layer) => {
          const arr = [];
          for (let c = 0; c < 4; c++) arr.push(encodeChannelRLE(layer.rgba, c, width, height));
          return arr;
        });

        const CHANNEL_IDS = [0, 1, 2, -1];

        for (let i = 0; i < nLayers; i++) {
          w.u32(0);
          w.u32(0);
          w.u32(height);
          w.u32(width);

          w.u16(4);
          for (let c = 0; c < 4; c++) {
            w.i16(CHANNEL_IDS[c]);
            w.u32(2 + 2 * height + chansPerLayer[i][c].data.length);
          }

          w.ascii('8BIM');
          w.ascii('norm');
          w.u8(255);
          w.u8(0);
          w.u8(0);
          w.u8(0);

          const exLenPos = w.pos;
          w.u32(0);
          const exStart = w.pos;

          w.u32(0);
          w.u32(0);

          const nameBytes = new TextEncoder().encode(layers[i].name || ('Layer ' + i));
          const nameLen = Math.min(nameBytes.length, 200);
          w.u8(nameLen);
          w.bytes(nameBytes.subarray(0, nameLen));
          let nameTotal = 1 + nameLen;
          while (nameTotal % 4 !== 0) {w.u8(0); nameTotal++;}

          w.patchU32(exLenPos, w.pos - exStart);
        }

        for (let i = 0; i < nLayers; i++) {
          for (let c = 0; c < 4; c++) {
            const ch = chansPerLayer[i][c];
            w.u16(1);
            for (let y = 0; y < height; y++) w.u16(ch.counts[y]);
            w.bytes(ch.data);
          }
        }

        let liLen = w.pos - liStart;
        while (liLen % 4 !== 0) {w.u8(0); liLen++;}
        w.patchU32(liLenPos, liLen);

        w.u32(0);
        w.patchU32(lmLenPos, w.pos - lmStart);

        w.u16(1);
        const mergedChans = [];
        for (let c = 0; c < 4; c++) mergedChans.push(encodeChannelRLE(mergedRgba, c, width, height));

        for (let c = 0; c < 4; c++) {
          for (let y = 0; y < height; y++) w.u16(mergedChans[c].counts[y]);
        }
        for (let c = 0; c < 4; c++) w.bytes(mergedChans[c].data);

        return w.result();
      }

      /* =========================================================
       *  11. 导出动作
       * ========================================================= */
      async function exportPNG(composite) {
        let src;
        try {
          src = buildExportCanvas(composite);
        } catch (err) {
          console.error(err);
          toast('生成图片失败：' + err.message);
          return;
        }

        if ($('autoCrop').checked) {
          const cropped = cropCanvas(src);
          if (cropped) src = cropped;
          else if (!composite) {toast('画布为空'); return;}
        }

        if (!src || src.width === 0 || src.height === 0) {
          toast('画布为空');
          return;
        }

        try {
          const blob = await toBlobAsync(src);
          downloadBlob(blob, 'signature-' + Date.now() + '.png');
          toast('PNG 已导出');
        } catch (err) {
          console.error(err);
          toast('导出失败：' + err.message);
        }
      }

      function exportPSD() {
        if (!hasContent()) {toast('画布为空，请先签名'); return;}

        const w = pad.width;
        const h = pad.height;
        if (w === 0 || h === 0) {toast('画布尺寸异常'); return;}

        const layers = [];

        if (state.bgImage) {
          const bgCanvas = document.createElement('canvas');
          bgCanvas.width = w;
          bgCanvas.height = h;
          const bc = bgCanvas.getContext('2d', {willReadFrequently: true});
          bc.fillStyle = '#ffffff';
          bc.fillRect(0, 0, w, h);
          drawImageContain(bc, state.bgImage, w, h);
          layers.push({name: 'Background', rgba: bc.getImageData(0, 0, w, h).data});
        }

        if (!handwritingIsEmpty()) {
          layers.push({name: 'Handwriting', rgba: ctx.getImageData(0, 0, w, h).data});
        }

        for (let i = 0; i < objects.length; i++) {
          const obj = objects[i];
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const oc = c.getContext('2d', {willReadFrequently: true});
          const objScale = w / (paper.clientWidth || 1);
          drawObjectToCtx(oc, obj, objScale);

          let name;
          if (obj.type === 'text') {
            name = 'Text: ' + obj.text.slice(0, 12);
          } else {
            name = 'Signature Image';
          }
          layers.push({name, rgba: oc.getImageData(0, 0, w, h).data});
        }

        if (layers.length === 0) {toast('画布为空'); return;}

        const merged = mergeLayers(layers, w, h);
        const buf = encodePsd(w, h, layers, merged);

        const blob = new Blob([buf], {type: 'image/vnd.adobe.photoshop'});
        downloadBlob(blob, 'signature-' + Date.now() + '.psd');
        toast('PSD 已导出（' + (blob.size / 1024 / 1024).toFixed(2) + ' MB）', 2600);
      }

      /* =========================================================
       *  12. 事件绑定
       * ========================================================= */

      function bindSwatches(container, onPick) {
        container.querySelectorAll('.swatch').forEach((btn) => {
          btn.addEventListener('click', () => {
            container.querySelectorAll('.swatch').forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            onPick(btn.dataset.color);
          });
        });
      }

      bindSwatches($('colorGroup'), (color) => {
        state.color = color;
        $('colorPick').value = color;
        state.eraser = false;
        $('btnEraser').classList.remove('active');
        $('btnPen').classList.add('active');
      });

      $('colorPick').addEventListener('input', (e) => {
        state.color = e.target.value;
        $('colorGroup').querySelectorAll('.swatch').forEach((b) => b.classList.remove('active'));
        state.eraser = false;
        $('btnEraser').classList.remove('active');
        $('btnPen').classList.add('active');
      });

      $('sizeRange').addEventListener('input', (e) => {
        state.size = parseFloat(e.target.value);
        $('sizeVal').textContent = state.size;
      });

      $('btnPen').addEventListener('click', () => {
        state.eraser = false;
        $('btnPen').classList.add('active');
        $('btnEraser').classList.remove('active');
      });
      $('btnEraser').addEventListener('click', () => {
        state.eraser = true;
        $('btnEraser').classList.add('active');
        $('btnPen').classList.remove('active');
      });

      $('btnUndo').addEventListener('click', undo);
      $('btnRedo').addEventListener('click', redo);
      $('btnClear').addEventListener('click', () => {
        if (!hasContent()) {showHint(); return;}
        if (!confirm('确定要清空所有笔迹和签名对象吗？')) return;
        clearPad();
        objects.slice().forEach((o) => deleteObject(o.id));
        selectObject(null);
        showHint();
        toast('已清空');
      });

      window.addEventListener('keydown', (e) => {
        const mod = e.ctrlKey || e.metaKey;
        if (mod && e.key.toLowerCase() === 'z') {
          e.preventDefault();
          e.shiftKey ? redo() : undo();
        } else if (mod && e.key.toLowerCase() === 'y') {
          e.preventDefault();
          redo();
        }
      });

      /* ---------- 插入签名图片（用 FileReader 读 dataURL，避免 blob 失效） ---------- */
      $('fileSign').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (!file.type.startsWith('image/')) {toast('请选择图片文件'); return;}
        addImageObject(file).catch((err) => {
          console.error(err);
          toast('图片读取失败：' + err.message);
        });
      });

      /* ---------- 设置底图（修复：用 FileReader → dataURL，确保预览和导出都正常） ---------- */
      $('fileBg').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        if (!file.type.startsWith('image/')) {toast('请选择图片文件'); return;}

        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;

          // 用同一个 dataURL 生成两个独立 Image：一个用于预览，一个用于导出
          const previewImg = new Image();
          previewImg.onload = () => {
            bgImg.onload = () => {
              bgImg.style.display = 'block';
            };
            bgImg.onerror = () => {
              toast('底图预览失败');
            };
            bgImg.src = dataUrl;
          };
          previewImg.onerror = () => toast('图片解码失败');
          previewImg.src = dataUrl;

          const exportImg = new Image();
          exportImg.onload = () => {
            state.bgImage = exportImg;
            toast('底图已设置');
          };
          exportImg.onerror = () => toast('底图加载失败');
          exportImg.src = dataUrl;
        };
        reader.onerror = () => toast('文件读取失败');
        reader.readAsDataURL(file);
      });

      $('btnRemoveBg').addEventListener('click', () => {
        state.bgImage = null;
        bgImg.style.display = 'none';
        bgImg.removeAttribute('src');
        toast('底图已移除');
      });

      /* ---------- 导出 ---------- */
      $('btnPng').addEventListener('click', () => exportPNG(false));
      $('btnPngComposite').addEventListener('click', () => exportPNG(true));

      $('btnPsd').addEventListener('click', () => {
        if (!hasContent()) {toast('画布为空，请先签名'); return;}
        toast('正在生成 PSD…', 8000);
        setTimeout(() => {
          try {
            exportPSD();
          } catch (err) {
            console.error(err);
            toast('PSD 生成失败：' + err.message, 4000);
          }
        }, 80);
      });

      /* =========================================================
       *  13. 文字签名面板
       * ========================================================= */
      const TEXT_COLORS = [
        '#111111', '#1a3fa0', '#c0272d', '#0b7a3b', '#6b3fa0',
        '#b07d00', '#8a5a2b', '#0f7b8a', '#d6336c', '#5c6675'
      ];
      let textColor = '#111111';

      function initTextPanel() {
        const sel = $('fontSelect');
        FONTS.forEach((f, i) => {
          const opt = document.createElement('option');
          opt.value = f.value;
          opt.textContent = f.name;
          if (i === 3) opt.selected = true;
          sel.appendChild(opt);
        });

        const colorsBox = $('textColors');
        TEXT_COLORS.forEach((c, i) => {
          const b = document.createElement('button');
          b.className = 'swatch' + (i === 0 ? ' active' : '');
          b.style.background = c;
          b.dataset.color = c;
          b.addEventListener('click', () => {
            textColor = c;
            colorsBox.querySelectorAll('.swatch').forEach((x) => x.classList.remove('active'));
            b.classList.add('active');
            $('textColorPick').value = c;
          });
          colorsBox.appendChild(b);
        });

        $('textColorPick').addEventListener('input', (e) => {
          textColor = e.target.value;
          colorsBox.querySelectorAll('.swatch').forEach((x) => x.classList.remove('active'));
        });

        $('fontSizeRange').addEventListener('input', (e) => {
          $('fontSizeVal').textContent = e.target.value;
        });
      }

      function openTextPanel() {
        $('mask').classList.add('show');
        $('textPanel').classList.add('show');
        setTimeout(() => {$('textInput').focus(); $('textInput').select();}, 50);
      }
      function closeTextPanel() {
        $('mask').classList.remove('show');
        $('textPanel').classList.remove('show');
      }

      $('btnTextPanel').addEventListener('click', openTextPanel);
      $('btnCloseText').addEventListener('click', closeTextPanel);
      $('mask').addEventListener('click', closeTextPanel);

      $('btnAddText').addEventListener('click', () => {
        const text = $('textInput').value.trim();
        if (!text) {toast('请输入签名文字'); $('textInput').focus(); return;}
        const fontFamily = $('fontSelect').value;
        const fontSize = parseFloat($('fontSizeRange').value);
        addTextObject(text, fontFamily, textColor, fontSize);
        closeTextPanel();
      });

      $('textInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          $('btnAddText').click();
        }
      });

      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('touchmove', (e) => {
        if (e.target === pad) e.preventDefault();
      }, {passive: false});

      /* =========================================================
       *  14. 启动
       * ========================================================= */
      function init() {
        initTextPanel();
        layout();
        requestAnimationFrame(() => {
          layout();
          updateUI();
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>

</html>
